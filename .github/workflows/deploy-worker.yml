name: 00 Deploy Worker

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # 只替换 ID 和删 R2
      - name: Generate wrangler config for CI
        shell: bash
        run: |
          cp wrangler.example.toml wrangler.ci.toml
          sed -i "s|YOUR_D1_DATABASE_ID_HERE|${{ secrets.REAL_D1_ID }}|g" wrangler.ci.toml
          sed -i "s|YOUR_KV_NAMESPACE_ID_HERE|${{ secrets.REAL_KV_ID }}|g" wrangler.ci.toml
          sed -i '/^\[\[r2_buckets\]\]$/,/^$/d' wrangler.ci.toml

      # 直接部署（带 Global API Key）
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        shell: bash
        run: |
          npx wrangler deploy --config wrangler.ci.toml
